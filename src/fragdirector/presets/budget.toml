# Preset "budget": "make it 30 seconds".
# The same shots as "killer", then fitted to [budget] seconds: time is split
# between the shots by score, and the lowest-score shots are left out first.
# Fitting works with any preset: give another one a budget with
#   fragdirector plan demo.dem --preset major-replay --budget 30
# The settings are explained in killer.toml.

description = "The killer's view, fitted to 30 seconds."

[shots]
killer = true
victims = false
replay = false

[killer]
split_gap_seconds = 6.0
pre_roll_seconds = 2.0
pre_roll_per_gap_second = 0.5
pre_roll_max_seconds = 4.0
post_roll_seconds = 1.0
post_roll_per_gap_second = 0.25
post_roll_max_seconds = 2.0

[victims]
seconds = 4.0
after_death_seconds = 1.5

[replay]
speed = 0.5
before_seconds = 1.5
after_seconds = 0.5

[limits]
min_shot_seconds = 2.0

[budget]
seconds = 30.0
max_stretch = 2.0
keep_before_seconds = 1.0
keep_after_seconds = 0.5
victim_weight = 0.5
replay_weight = 0.7
