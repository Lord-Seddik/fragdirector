[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fragdirector"
version = "0.1.0"
description = "Turn a CS2 demo into a finished multi-POV highlight video."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["demoparser2>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fragdirector = "fragdirector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fragdirector = ["weights.default.toml", "presets/*.toml", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
